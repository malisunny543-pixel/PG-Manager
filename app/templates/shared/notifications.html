{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block breadcrumbs %}Account / Notifications{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">
    <h2>Notifications</h2>
    <form method="POST" action="/notifications/read-all" style="display: inline;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-secondary">Mark All as Read</button>
    </form>
  </div>

  <div style="padding: 1rem 0;">
    <p style="color: var(--slate-500); text-align: center; padding: 2rem 0;">No unread notifications.</p>
  </div>
</div>
{% endblock %}
