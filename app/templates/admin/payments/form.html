{% extends "base.html" %}
{% block title %}Record Payment - PG Management System{% endblock %}
{% block breadcrumbs %}Administration / <a href="{{ url_for('admin.payments_index') }}">Payments</a> / Record{% endblock %}
{% block content %}
<div style="max-width: 650px;">
  <div class="card">
    <div class="card-header">
      <h2>Record Rent / Utility Payment</h2>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="invoice_id">Target Invoice *</label>
        <select id="invoice_id" name="invoice_id" class="form-control" required onchange="updateMaxAmount(this)">
          <option value="">-- Select Pending Invoice --</option>
          {% for inv in invoices %}
            <option value="{{ inv.id }}" data-balance="{{ inv.balance_due }}" {% if selected_inv|string == inv.id|string %}selected{% endif %}>
              {{ inv.invoice_number }} &mdash; {{ inv.first_name }} {{ inv.last_name }} ({{ inv.billing_month }}) &bull; Outstanding: {{ inv.balance_due|currency }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="amount">Payment Amount (₹) *</label>
          <input type="number" step="0.01" id="amount" name="amount" class="form-control" required placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label" for="payment_method">Payment Method *</label>
          <select id="payment_method" name="payment_method" class="form-control" required>
            <option value="UPI">UPI / QR Code</option>
            <option value="CASH">Cash</option>
            <option value="BANK_TRANSFER">Bank Transfer / IMPS / NEFT</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="transaction_reference">Transaction Reference / Receipt No *</label>
        <input type="text" id="transaction_reference" name="transaction_reference" class="form-control" required placeholder="e.g. UPI Ref / UTR / Cash Receipt No">
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Notes / Remarks</label>
        <textarea id="notes" name="notes" class="form-control" rows="2" placeholder="Optional comments..."></textarea>
      </div>

      <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        <button type="submit" class="btn btn-primary">Log Payment</button>
        <a href="{{ url_for('admin.payments_index') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
function updateMaxAmount(selectElem) {
  const opt = selectElem.options[selectElem.selectedIndex];
  if (opt && opt.dataset.balance) {
    document.getElementById('amount').value = opt.dataset.balance;
  }
}
document.addEventListener('DOMContentLoaded', () => {
  const invSelect = document.getElementById('invoice_id');
  if (invSelect && invSelect.value) {
    updateMaxAmount(invSelect);
  }
});
</script>
{% endblock %}
